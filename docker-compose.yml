# Infraestrutura local do projeto (requisitos de ML I e Etapa 8):
#   PostgreSQL 16 (banco), MinIO (artefatos, compatível com S3) e MLflow (rastreamento).
# Uso: docker compose up -d   ·   depois: python -m aps_sintetico tudo
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aps}
      POSTGRES_DB: ${POSTGRES_DB:-aps_recife}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aps}"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 5; mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minio} $${MINIO_ROOT_PASSWORD:-minio12345};
      mc mb -p local/mlflow; exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}

  mlflow:
    build: ./docker/mlflow
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-aps}:${POSTGRES_PASSWORD:-aps}@postgres:5432/${POSTGRES_DB:-aps_recife}
      --artifacts-destination s3://mlflow --serve-artifacts
    ports: ["5000:5000"]

volumes:
  pgdata:
  miniodata:
